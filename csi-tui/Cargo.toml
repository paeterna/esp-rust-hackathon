[package]
name = "csi-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "csi-tui"
path = "src/main.rs"

[[bin]]
name = "test-serial"
path = "test_serial.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
color-eyre = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
