[package]
name = "esp-csi-tui-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# Serial communication
serialport = "4.5"

# Data processing
num-complex = "0.4"

# Data storage
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
rerun = "0.18"

# Error handling
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Time
chrono = "0.4"
