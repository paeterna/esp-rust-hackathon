[package]
name = "my-esp32-project"
version = "0.1.0"
edition = "2021"

[package.metadata.esp-idf-sys]
mcu = "esp32c3"

[dependencies]
esp-hal = { version = "1.0", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.13", features = ["esp32c3"] }
esp-backtrace = { version = "0.15", features = ["esp32c3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.1" }

[build-dependencies]
esp-build = "0.2"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "z"
lto = true
