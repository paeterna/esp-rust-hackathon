[package]
name = "my-esp32-project"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
esp-idf-svc = { version = "0.51", default-features = false, features = ["binstart", "alloc"] }
esp-idf-hal = "0.45"
esp-idf-sys = "0.36"
log = "0.4"
anyhow = "1.0"

[build-dependencies]
embuild = "0.33"

[profile.dev]
opt-level = "z"
debug = false

[profile.release]
opt-level = "s"
lto = true
strip = true

